<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Mesas</title>
  <style>
    body { font-family: sans-serif; padding: 15px; background: #fff; color: #000; }
    button { padding: 8px 12px; margin: 4px; font-size: 16px; cursor: pointer; }
    
    .panel { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px; }
    
    .columna-invitados {
      border: 2px solid #000;
      padding: 10px;
      min-width: 220px;
      min-height: 200px;
    }
    
    .grid-mesas {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      flex: 1;
    }
    
    .mesa {
      border: 2px solid #333;
      padding: 10px;
      min-width: 200px;
      min-height: 150px;
      background: #fafafa;
    }

    .tarjeta-invitado {
      border: 1px solid #666;
      background: #eee;
      padding: 6px;
      margin: 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <h2>Acomodador de Mesas</h2>

  <div>
    <input type="text" id="nuevo-nombre" placeholder="Nombre del invitado">
    <button onclick="agregarInvitado()">+ Agregar Invitado</button>
    <button onclick="agregarMesa()">+ Agregar Mesa</button>
  </div>

  <div class="panel">
    <div>
      <h3>Sin Mesa</h3>
      <div id="lista-espera" class="columna-invitados">
        <!-- Invitados de prueba iniciales -->
        <div class="tarjeta-invitado" id="inv-1">
          <span>Invitado 1</span>
          <button onclick="moverAMesa('inv-1')">Mover a...</button>
        </div>
      </div>
    </div>

    <div>
      <h3>Mesas</h3>
      <div id="contenedor-mesas" class="grid-mesas">
        <!-- Las mesas se generarán aquí -->
      </div>
    </div>
  </div>

  <script>
    let contadorMesa = 0;
    let contadorInvitado = 1;

    // Crear la primera mesa por defecto
    agregarMesa();

    function agregarMesa() {
      contadorMesa++;
      const contenedor = document.getElementById('contenedor-mesas');
      const divMesa = document.createElement('div');
      divMesa.className = 'mesa';
      divMesa.id = `mesa-${contadorMesa}`;
      divMesa.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>Mesa ${contadorMesa}</strong>
          <button onclick="eliminarMesa('mesa-${contadorMesa}')">X</button>
        </div>
        <hr>
        <div class="zona-sillas" id="sillas-mesa-${contadorMesa}"></div>
      `;
      contenedor.appendChild(divMesa);
    }

    function agregarInvitado() {
      const input = document.getElementById('nuevo-nombre');
      const nombre = input.value.trim();
      if (!nombre) return;

      contadorInvitado++;
      const idInv = `inv-${contadorInvitado}`;
      const listaEspera = document.getElementById('lista-espera');
      
      const divInv = document.createElement('div');
      divInv.className = 'tarjeta-invitado';
      divInv.id = idInv;
      divInv.innerHTML = `
        <span>${nombre}</span>
        <button onclick="moverAMesa('${idInv}')">Mover a...</button>
      `;
      
      listaEspera.appendChild(divInv);
      input.value = '';
    }

    function moverAMesa(idInvitado) {
      const invitado = document.getElementById(idInvitado);
      const mesas = document.querySelectorAll('.mesa');
      
      if (mesas.length === 0) {
        alert("Primero crea una mesa.");
        return;
      }

      // Crear lista de opciones para seleccionar mesa
      let opciones = "Ingresa el número de mesa al que deseas moverlo:\n\n";
      opciones += "0 = Sin Mesa (Lista de espera)\n";
      mesas.forEach((m, index) => {
        const num = m.id.replace('mesa-', '');
        opciones += `${num} = Mesa ${num}\n`;
      });

      const seleccion = prompt(opciones);
      if (seleccion === null) return;

      if (seleccion.trim() === '0') {
        document.getElementById('lista-espera').appendChild(invitado);
      } else {
        const destino = document.getElementById(`sillas-mesa-${seleccion.trim()}`);
        if (destino) {
          destino.appendChild(invitado);
        } else {
          alert("Esa mesa no existe.");
        }
      }
    }

    function eliminarMesa(idMesa) {
      const mesa = document.getElementById(idMesa);
      const sillas = mesa.querySelector('.zona-sillas');
      const listaEspera = document.getElementById('lista-espera');
      
      // Regresar invitados a la lista de espera antes de borrar la mesa
      while (sillas.firstChild) {
        listaEspera.appendChild(sillas.firstChild);
      }
      mesa.remove();
    }
  </script>

</body>
</html>
